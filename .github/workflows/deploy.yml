name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m

          script: |
            set -e
            cd /opt/apps/tumc-gear
            # Authenticate explicitly with the workflow-scoped GITHUB_TOKEN so the
            # pull doesn't depend on any git credentials being configured on the
            # VPS itself (which caused "could not read Username" failures).
            git pull "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/marshallhhhh/tumc-gear.git" main

            cd /opt/apps/supabase

            # Rebuild the backend image with the latest code first, so the
            # migration below runs against the current migrations directory.
            docker compose build backend

            # The DB is only reachable from inside the VPS's docker network now,
            # so run the migration as a one-off container on that network rather
            # than from the GitHub runner. db:migrate runs `prisma migrate deploy`
            # and then applies manual_indexes.sql (partial unique indexes that
            # can't be expressed in the Prisma schema; all statements are
            # IF NOT EXISTS guarded and therefore idempotent).
            docker compose run --rm --no-deps backend npm run db:migrate

            # recreate the backend container with the newly built image
            docker compose up -d --force-recreate --no-deps backend
