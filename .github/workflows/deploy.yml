name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /opt/apps/tumc-gear
            git pull origin main
            
            # build frontend
            npm ci 
            cd frontend
            npm run build
            rf -rf /var/www/tumc-gear/*
            cp -r dist/* /var/www/tumc-gear/

            #rebuild backend container
            cd /opt/apps/supabase
            docker compose up -d --force-recreate --no-deps gear_backend