name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      # Partial unique indexes cannot be expressed in the Prisma schema, so they
      # live in manual_indexes.sql and must be applied after every migration.
      # All statements are IF NOT EXISTS guarded and therefore idempotent.
      - name: Apply manual indexes
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/manual_indexes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: migrate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m

          script: |
            set -e
            cd /opt/apps/tumc-gear
            git pull origin main

            # rebuild backend container
            cd /opt/apps/supabase
            docker compose up -d --force-recreate --no-deps backend
