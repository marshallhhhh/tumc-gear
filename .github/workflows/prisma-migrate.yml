name: Prisma Migrate (Production)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}

      # Partial unique indexes cannot be expressed in the Prisma schema, so they
      # live in manual_indexes.sql and must be applied after every migration.
      # All statements are IF NOT EXISTS guarded and therefore idempotent.
      - name: Apply manual indexes
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/manual_indexes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
